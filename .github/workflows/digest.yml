name: digest

# Weekly cross-note briefing using Z.AI GLM-5.3 through the existing
# OpenAI-compatible SDK path. This job checks out the vault, folds everything
# saved to notes/ in the last 7 days into ONE `type: digest` note via a single
# GLM-5.3 call, and commits it back. No database; same structure as ingest.yml,
# separate concurrency group so a Sunday digest run never contends with a
# nightly ingest run.

on:
  workflow_dispatch: # manual run, e.g. to dry-run before trusting the cron
  schedule:
    - cron: "0 4 * * 0"    # Sundays 04:00 UTC, after Saturday night's ingest

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # One LLM call total (not per-source like ingest) — a few minutes is generous.
    timeout-minutes: 15

    steps:
      - name: Checkout engine code
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Checkout vault data
        uses: actions/checkout@v4
        with:
          repository: rohitgupta1686/pkm-vault
          token: ${{ secrets.VAULT_PAT }}
          path: vault
          persist-credentials: true
          fetch-depth: 0  # full history so the rebase-and-push retry works

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        run: pip install -e ./engine   # no libsql/Rust deps → fast, wheel-only

      - name: Run weekly digest (single GLM-5.3 call)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.z.ai/api/paas/v4/
          SYNTHESIS_MODEL: glm-5.3
        run: pkm digest --days 7 --vault "$GITHUB_WORKSPACE/vault"

      - name: Commit digest note
        working-directory: vault
        run: |
          git config user.name "pkm-bot"
          git config user.email "pkm-bot@users.noreply.github.com"
          git add notes/
          if git diff --cached --quiet; then
            echo "No digest note to commit (nothing saved this period)."
            exit 0
          fi
          git commit -m "digest: $(date -u +%FT%TZ)"
          # ingest.yml (or a concurrent clip commit) may land between our
          # checkout and push, so a bare push can reject as non-fast-forward.
          # Rebase and retry a few times to absorb that.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed digest on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed (concurrent push?); retrying in 5s..."
            sleep 5
          done
          echo "ERROR: failed to push digest note after 5 attempts." >&2
          exit 1

      # GUARD-07 off-site backup moved to vault-backup.yml (nightly, single writer,
      # fast-forward only + dated snapshot tags) — 2026-10-09.
